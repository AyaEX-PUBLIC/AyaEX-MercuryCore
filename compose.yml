# Config file for compose, a tool that allows for easily managing multiple containers.
# https://docs.docker.com/compose/

# Aya deployment: the Site and Caddy share the host network so they can reach
# the natively running Orbiter (64991/64992) and RCC proxy (64990), which
# manage native Aya.Server gameservers. See aya/README.md.

# The Site listens twice: the public instance on 4443 has a 1MB body limit,
# and the upload-only instance on 4445 accepts the larger place/asset bodies.
# Caddy routes only the upload paths to 4445; both instances share the data
# volume and database. See Site/src/lib/server/requestLimits.ts.
x-site: &site
    build: .
    image: mercurycore-site
    network_mode: host
    user: ${AYA_DATA_UID:-1000}:${AYA_DATA_GID:-1000}
    restart: unless-stopped
    # PORT and ORIGIN are read at runtime, not only at build time
    env_file: Site/.env
    volumes:
        # the Site reads ../data relative to /app/Site
        - ./data:/app/data
        # Aya's local asset library, a fallback for assets Mercury doesn't have
        - ${AYA_ASSETS_HOST_DIR:-../aya-dev/assets}:/aya-assets:ro
    depends_on:
        - database # will keep retrying until database is ready
        - economy

services:
    database:
        # not :nightly because doing that once caused failures when graph linking
        # and also caused errors with query parameters (twice)
        build: ./Database
        # Built images are named, so docker compose (v2) and docker-compose
        # (v1, which would call them mercurycore_*) use the same ones
        image: mercurycore-database
        # run as the owner of ./data so the bind-mounted files stay accessible
        user: ${AYA_DATA_UID:-1000}:${AYA_DATA_GID:-1000}
        ports:
            - 127.0.0.1:8000:8000
        restart: unless-stopped
        volumes:
            - ./data/surreal:/database
        command:
            - start
            - -u=root
            - -p=root
            - surrealkv://database

    economy:
        build: ./Economy
        image: mercurycore-economy
        ports:
            - 127.0.0.1:2009:2009
        restart: unless-stopped
        volumes:
            - ./data/economy:/data/economy

    site:
        <<: *site
        environment:
            # Keep this in step with Site/.env.example. Env vars from the
            # compose file override Site/.env, so an old 1G value can't sneak
            # back in after an upgrade.
            BODY_SIZE_LIMIT: 1M
            AYA_ASSETS_DIR: /aya-assets
            # the Aya API (aya-dev compose) fetches Roblox assets Mercury and the
            # local library don't have; set empty to disable
            AYA_ASSET_FALLBACK_URL: ${AYA_ASSET_FALLBACK_URL-http://localhost:8005}
            # the StreamingFrame signaling relay (Site lib/server/streaming.ts),
            # on 127.0.0.1; Caddyfile.aya proxies /streaming/ws to it
            STREAMING_PORT: 4444

    site-uploads:
        <<: *site
        environment:
            # Caddy is the only way in; it routes the upload paths here
            PORT: 4445
            UPLOAD_ONLY: "1"
            BODY_SIZE_LIMIT: 101M
            AYA_ASSETS_DIR: /aya-assets
            AYA_ASSET_FALLBACK_URL: ${AYA_ASSET_FALLBACK_URL-http://localhost:8005}
            # this instance doesn't start the relay
            STREAMING_PORT: 4444

    caddy:
        # Standard Caddy plus the rate-limit module (deploy/Caddy.Dockerfile);
        # the edge limits live in Caddyfile.aya.
        build:
            context: .
            dockerfile: deploy/Caddy.Dockerfile
        image: mercurycore-caddy
        network_mode: host
        restart: unless-stopped
        volumes:
            - ./Caddyfile.aya:/etc/caddy/Caddyfile:ro
            # the unified Aya WebAssembly runtime (Player), per client channel:
            # dev is the live build output, stable a snapshot made by
            # aya/promote-stable.sh (data/runtime/stable -> releases/<version>)
            - ${AYA_APP_DIST_DIR:-../aya-dev/build/wasm-app-rel/bin}:/srv/runtime-dev:ro
            - ./data/runtime:/srv/runtime-channels:ro
        depends_on:
            - site
            - site-uploads

    # Discord bot handing out registration keys (DiscordBot/README.md).
    # Fill in DiscordBot/.env, then: docker compose --profile discord up -d --build discordbot
    discordbot:
        build: ./DiscordBot
        image: mercurycore-discordbot
        profiles: [discord]
        restart: unless-stopped
        env_file: DiscordBot/.env
        volumes:
            # key prefix and site name come from Mercury's config
            - ./mercury.core.ts:/app/mercury.core.ts:ro
        depends_on:
            - database
